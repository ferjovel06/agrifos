services:
  api:
    image: agrifos-backend:local
    build:
      context: backend
      target: runtime
    env_file: backend/.env
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:ro
    command: [uvicorn, app.main:app, --host, "0.0.0.0", --port, "8000", --reload]

  backend-tests:
    profiles: [test]
    image: agrifos-backend:local-test
    build:
      context: backend
      target: test
    network_mode: none
