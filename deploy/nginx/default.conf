map "$request_method:$uri" $auth_limit_key {
    default "";
    "POST:/auth/login" $binary_remote_addr;
    "POST:/auth/mfa/verify" $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_login:10m rate=5r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_types application/json text/css application/javascript;

    location / {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
